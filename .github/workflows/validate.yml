name: validate

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.9
      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version: 22
      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: pnpm install --frozen-lockfile
      - run: pnpm test -- --runInBand
      - run: pnpm run build
      - name: Install EPUBCheck 5.3.0
        run: |
          curl --fail --location --output /tmp/epubcheck-5.3.0.zip https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip
          echo '6c07e68584b2e2ce2f89fe06e1246dfead3eb36b46b340e7d93524f29dcff6c5  /tmp/epubcheck-5.3.0.zip' | sha256sum --check
          unzip -q /tmp/epubcheck-5.3.0.zip -d /tmp
      - name: Install Ace browser
        run: pnpm exec puppeteer browsers install chrome
      - name: Validate generated EPUB artifacts
        env:
          EPUBCHECK_JAR: /tmp/epubcheck-5.3.0/epubcheck.jar
        run: pnpm validate
